services:
  - type: web
    name: mtp2026-app-launcher-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TIDB_SSL
        value: "true"
      - key: TIDB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: VEXA_ACCOUNT_CLIENT_SECRET
        sync: false
      - key: VEXA_ACCOUNT_SSO_CONFIG
        sync: false
      - key: MTP_SESSION_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MTP2026_RUNTIME_URL
        sync: false
      - key: MTP2026_RUNTIME_API_KEY
        sync: false

  - type: web
    name: mtp2026-qemu-runtime
    runtime: docker
    rootDir: runtime
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MTP2026_RUNTIME_API_KEY
        sync: false
      - key: MTP2026_RUNTIME_PUBLIC_URL
        sync: false
      - key: MTP2026_RELEASE_BASE_URL
        value: https://github.com/MyTeleProject2026/MTP2026-App-Launcher/releases/download/mtp2026-physical-test
      - key: MTP2026_MAX_GUESTS
        value: "4"
    disk:
      name: mtp2026-guest-data
      mountPath: /var/lib/mtp2026
      sizeGB: 20

  - type: web
    name: mtp2026-app-launcher-host
    runtime: static
    buildCommand: cd frontend-MTP2026-AppLauncher && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend-MTP2026-AppLauncher/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mtp2026-desktopos
    runtime: static
    buildCommand: cd frontend-MTP2026-2Desktop && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend-MTP2026-2Desktop/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mtp2026-android-os
    runtime: static
    buildCommand: cd frontend-MTP2026-Android && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend-MTP2026-Android/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mtp2026-rog-gaming-os
    runtime: static
    buildCommand: cd Frontend-MTP202026-ROG_gamingOS && npm install --no-audit --no-fund && npm run build
    staticPublishPath: Frontend-MTP202026-ROG_gamingOS/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mtp2026-device-os
    runtime: static
    buildCommand: cd frontend-MTP2026OS && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend-MTP2026OS/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
