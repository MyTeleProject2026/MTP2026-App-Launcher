name: MTP2026 Package Runtime Contract

on:
  push:
    branches: [main]
    paths:
      - 'frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js'
      - 'frontend-MTP2026-2Desktop/src/guestSystemRegistry.js'
      - 'frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json'
      - 'os/mtp2026-guest-profiles/**'
  pull_request:
    paths:
      - 'frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js'
      - 'frontend-MTP2026-2Desktop/src/guestSystemRegistry.js'
      - 'frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json'
      - 'os/mtp2026-guest-profiles/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js
          node --check frontend-MTP2026-2Desktop/src/guestSystemRegistry.js
      - name: Validate guest manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json','utf8')); if(m.schema!=='mtp2026-desktop-guest-runtime-v1') throw new Error('invalid desktop guest schema'); if(JSON.stringify(Object.keys(m.guests||{}))!==JSON.stringify(['desktop'])) throw new Error('Desktop frontend must expose exactly one guest profile'); const g=m.guests.desktop; if(!g || g.architecture!=='arm64' || !g.installSlot || g.profileLayout!=='desktop') throw new Error('invalid Desktop OS guest contract'); console.log('MTP2026 Desktop OS manifest OK');"
      - name: Validate profile source
        run: bash -n os/mtp2026-guest-profiles/build-all.sh
