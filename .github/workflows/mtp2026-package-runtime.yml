name: MTP2026 Package Runtime Contract

on:
  push:
    branches: [main]
    paths:
      - 'frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js'
      - 'frontend-MTP2026-2Desktop/src/guestSystemRegistry.js'
      - 'frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json'
      - 'os/mtp2026-guest-profiles/**'
  pull_request:
    paths:
      - 'frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js'
      - 'frontend-MTP2026-2Desktop/src/guestSystemRegistry.js'
      - 'frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json'
      - 'os/mtp2026-guest-profiles/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check frontend-MTP2026-2Desktop/src/mtp2026OsPackageRuntime.js
          node --check frontend-MTP2026-2Desktop/src/guestSystemRegistry.js
      - name: Validate guest manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('frontend-MTP2026-2Desktop/public/arm64/guest-manifest.json','utf8')); if(m.schema!=='mtp2026-guest-runtime-v8') process.exit(1); for(const id of ['mtp2026','android','desktop','gaming']) { if(!m.guests[id]) throw new Error('missing guest '+id); if(m.guests[id].architecture!=='arm64') throw new Error('guest '+id+' is not arm64'); if(!m.guests[id].installSlot) throw new Error('guest '+id+' missing install slot'); } console.log('MTP2026 guest manifest OK');"
      - name: Validate profile source
        run: bash -n os/mtp2026-guest-profiles/build-all.sh
