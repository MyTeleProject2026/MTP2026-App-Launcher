name: MTP2026 Desktop OS application package

on:
  push:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - ".github/workflows/mtp2026-desktop-os-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - ".github/workflows/mtp2026-desktop-os-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtp2026-desktop-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-os:
    name: Build MTP2026 Desktop Edition static application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-MTP2026-2Desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-MTP2026-2Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify desktop OS profile
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('os-profile.json','utf8')); if(p.id!=='desktop'||p.name!=='MTP2026 Desktop Edition'||p.deviceMode!=='desktop'||p.architecture!=='arm64'||p.render!=='static-site') process.exit(1); console.log(JSON.stringify(p,null,2))"

      - name: Build desktop static application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Verify desktop application output
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/arm64/guest-manifest.json
          test -s dist/site-profile.js
          test -s dist/build-info.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8')); if(m.name!=='MTP2026 Desktop Edition'||m.short_name!=='MTP2026'||m.start_url!=='/'||m.scope!=='/'||m.display!=='standalone') process.exit(1)"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('dist/arm64/guest-manifest.json','utf8')); const g=p.guests?.desktop; if(!g||g.id!=='desktop'||g.architecture!=='arm64'||g.imageRequired!==true||g.runtime?.backend!=='qemu-system-aarch64') process.exit(1); console.log('Desktop guest contract:',JSON.stringify(g))"
          node -e "const fs=require('fs'); const s=fs.readFileSync('dist/site-profile.js','utf8'); if(!s.includes('id:\'desktop\'')||!s.includes('deviceMode:\'desktop\'')||!s.includes('architecture:\'arm64\'')) process.exit(1); console.log('Desktop site profile contract verified.')"
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('dist/build-info.json','utf8')); if(b.product!=='MTP2026 Desktop Edition'||b.architecture!=='arm64'||b.commit!==process.env.EXPECTED_COMMIT) process.exit(1); console.log('Build contract:',JSON.stringify(b))"
          grep -q "MTP2026 Desktop Edition" dist/index.html
          echo "MTP2026 Desktop Edition static application package is ready."

      - name: Package desktop application
        run: |
          tar -C dist -czf ../mtp2026-desktop-os-static-site.tar.gz .
          sha256sum ../mtp2026-desktop-os-static-site.tar.gz > ../mtp2026-desktop-os-static-site.tar.gz.sha256

      - name: Upload desktop application package
        uses: actions/upload-artifact@v7
        with:
          name: mtp2026-desktop-os-static-application
          if-no-files-found: error
          path: |
            frontend-MTP2026-2Desktop/mtp2026-desktop-os-static-site.tar.gz
            frontend-MTP2026-2Desktop/mtp2026-desktop-os-static-site.tar.gz.sha256
