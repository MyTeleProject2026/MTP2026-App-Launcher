name: MTP2026 native ARM64 Desktop OS

on:
  push:
    branches: [main]
    paths:
      - "os/**"
      - "frontend-MTP2026-2Desktop/**"
      - ".github/workflows/mtp2026-native-arm64-os.yml"
  pull_request:
    branches: [main]
    paths:
      - "os/**"
      - "frontend-MTP2026-2Desktop/**"
      - ".github/workflows/mtp2026-native-arm64-os.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtp2026-native-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-os:
    name: Build and boot-test MTP2026 Desktop OS
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ARM64 build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex cpio gzip xz-utils curl qemu-system-arm

      - name: Build native ARM64 image
        run: |
          chmod +x os/build-native-os.sh
          os/build-native-os.sh

      - name: Verify native OS contract
        run: |
          set -euo pipefail
          test -s os/out/Image
          test -s os/out/mtp2026-desktop-arm64-initramfs.cpio.gz
          test -s os/out/native-os-manifest.json
          grep -q '"product": "MTP2026 Desktop OS"' os/out/native-os-manifest.json
          grep -q '"architecture": "arm64"' os/out/native-os-manifest.json
          grep -q '"bootable": true' os/out/native-os-manifest.json
          sha256sum -c os/out/SHA256SUMS

      - name: Boot-test the native OS with QEMU
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout 45s qemu-system-aarch64 \
            -machine virt -cpu cortex-a57 -m 512M -nographic \
            -kernel os/out/Image \
            -initrd os/out/mtp2026-desktop-arm64-initramfs.cpio.gz \
            -append 'console=ttyAMA0 rdinit=/init' > os/out/qemu-boot.log 2>&1 || true
          grep -q 'MTP2026 Desktop OS' os/out/qemu-boot.log
          grep -q 'Native boot completed.' os/out/qemu-boot.log
          grep -q 'MTP2026 Desktop Edition' os/out/qemu-boot.log
          echo 'MTP2026 native ARM64 boot contract verified.'

      - name: Package native OS
        run: |
          tar -C os/out -czf mtp2026-desktop-os-arm64-native.tar.gz Image mtp2026-desktop-arm64-initramfs.cpio.gz native-os-manifest.json SHA256SUMS
          sha256sum mtp2026-desktop-os-arm64-native.tar.gz > mtp2026-desktop-os-arm64-native.tar.gz.sha256

      - name: Upload native OS image
        uses: actions/upload-artifact@v7
        with:
          name: mtp2026-desktop-os-arm64-native
          if-no-files-found: error
          path: |
            mtp2026-desktop-os-arm64-native.tar.gz
            mtp2026-desktop-os-arm64-native.tar.gz.sha256
            os/out/qemu-boot.log
