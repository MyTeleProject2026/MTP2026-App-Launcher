name: MTP2026 Device OS Manifest Verification

on:
  push:
    branches: [main]
    paths:
      - 'os/mtp2026-device-os/**'
      - 'frontend/public/branding/**'
      - 'frontend/public/icon.svg'
      - '.github/workflows/mtp2026-device-os-manifest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'os/mtp2026-device-os/**'
      - 'frontend/public/branding/**'
      - 'frontend/public/icon.svg'
      - '.github/workflows/mtp2026-device-os-manifest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate MTP2026 Device OS manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'os/mtp2026-device-os/device-manifest.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (m.id !== 'mtp2026-device-os') throw new Error('invalid OS id');
          if (m.name !== 'MTP2026 Device OS') throw new Error('invalid OS name');
          if (!m.architecture.includes('arm64')) throw new Error('ARM64 target missing');
          if (m.identity.provider !== 'VexaAccount') throw new Error('VexaAccount identity provider missing');
          if (m.identity.store !== 'VexaStore') throw new Error('VexaStore missing');
          if (m.storage.partitions.length !== 4) throw new Error('logical partition contract incomplete');
          for (const id of ['system','user','applications','cache']) {
            if (!m.storage.partitions.some(p => p.id === id)) throw new Error(`missing partition: ${id}`);
          }
          console.log('MTP2026 Device OS manifest verified');
          NODE
      - name: Validate branding provenance
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'frontend/public/branding/brand-provenance.json';
          const b = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (b.brand !== 'MYTELEPROJECT2026') throw new Error('brand mismatch');
          if (b.product !== 'MTP2026 Device OS') throw new Error('product mismatch');
          if (!Array.isArray(b.variants) || b.variants.length < 8) throw new Error('branding variants incomplete');
          console.log('Brand provenance verified');
          NODE
      - name: Validate PWA icon
        run: |
          test -s frontend/public/icon.svg
          grep -q 'linearGradient id="gold"' frontend/public/icon.svg
          grep -q 'linearGradient id="blue"' frontend/public/icon.svg
          echo 'MTP2026 crown/M icon verified'
