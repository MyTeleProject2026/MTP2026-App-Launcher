name: MTP2026 App Launcher CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
          components: llvm-tools-preview
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/src/auth/vexaaccount-sso.js
          node --check backend/src/routes/vexaaccount-auth.js
          node --check tools/generate-integration.mjs
          node --check tools/patch-generated-integration.mjs
          node --check tools/verify-generated-integration.mjs
          node --check tools/build-arm64-kernel.mjs
          node --check frontend/src/auth.js
          node --check frontend/src/auth/vexaAuth.js
          node --check frontend/src/networkResilience.js
          node --check frontend/src/nativePlatformApi.js
          node --check frontend/src/nativeGuestStorage.js
          node --check frontend/src/osRuntime.js
          node --check frontend/src/guestSystemRegistry.js
          node --check frontend/src/guestRuntimeManifest.js
          node --check frontend/src/guestStorage.js
          node --check frontend/src/guestImageStore.js
          node --check frontend/src/guestImageManager.js
          node --check frontend/src/arm64GuestRuntime.js
          node --check frontend/src/arm64GuestWorker.js
          node --check frontend/src/guestBootController.js
          node --check frontend/src/mtp2026GuestProfiles.js
          node --check frontend/src/mtp2026GuestShell.js
          node --check frontend/src/mtp2026GuestShellEnhancements.js
          node --check frontend/src/mtp2026GuestOSRuntime.js
          node --check frontend/src/mtp2026GuestOSBridge.js
          node --check frontend/src/mtp2026DesktopExperience.js
          node --check frontend/src/mtp2026UniversalOS.js
          node --check frontend/src/mtp2026VexaStoreRuntime.js
          node --check frontend/src/startupOrchestrator.js
          node --check frontend/src/systemBootExperience.js
          node --check frontend/src/experience.js
          node --check frontend/src/experienceLoader.js
          node --check frontend/src/mtp2026DeviceOS.js
          node --check frontend/src/mtp2026Branding.js
          node --check frontend/src/vexaStoreInstaller.js
          node --check frontend/src/mtp2026VexaStoreUI.js
          node --check frontend/src/webOsRuntime.js
          node --check frontend/src/webOsWorker.js
      - name: Verify MTP2026 OS branding contract
        run: node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('frontend/public/branding/mtp2026-os-branding.json','utf8')); if(b.name!=='MTP2026'||b.deviceName!=='MTP2026 Device'||b.osName!=='MTP2026 Device OS'||b.identity.provider!=='VexaAccount'||b.store.provider!=='VexaStore') throw new Error('Invalid MTP2026 branding contract'); console.log('Branding contract verified');"
      - name: Verify MTP2026 branding assets
        run: |
          test -s frontend/public/branding/mtp2026-mark.svg
          test -s frontend/public/branding/mtp2026-logo-horizontal.svg
          test -s frontend/public/branding/mtp2026-branding.json
      - name: Verify MTP2026 OS source contract
        run: |
          test -x os/mtp2026-linux-arm64/build.sh
          test -x os/mtp2026-guest-profiles/build-all.sh
          test -s os/mtp2026-linux-arm64/mtp2026-ui.c
          test -s os/mtp2026-linux-arm64/rootfs/init
          grep -q 'NAME="MTP2026 Device OS"' os/mtp2026-linux-arm64/rootfs/os-release
          grep -q 'MTP2026 DEVICE OS' os/mtp2026-linux-arm64/rootfs/motd
      - name: Verify guest runtime manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('frontend/public/arm64/guest-manifest.json','utf8')); for (const id of ['mtp2026','android','windows11','gaming']) { if (!m.guests[id] || m.guests[id].architecture !== 'arm64' || m.guests[id].imageRequired !== true) throw new Error('Invalid MTP2026-owned guest contract: '+id); if (m.guests[id].imageKind !== 'mtp2026-owned-arm64-linux-profile') throw new Error('Invalid MTP2026 profile image kind: '+id); } if (m.controlKernel.realOs !== false) throw new Error('Control kernel must not be classified as a real OS'); if (m.guests.android.nativePackagePolicy.indexOf('real/native Android host') === -1) throw new Error('Android package policy missing host boundary'); console.log('Guest runtime manifest verified');"
      - name: Build ARM64 guest kernel image
        run: npm run arm64:kernel:build
      - name: Verify ARM64 guest kernel image
        run: |
          test -s frontend/public/arm64/mtp2026-arm64-kernel.bin
          file frontend/public/arm64/mtp2026-arm64-kernel.bin
      - name: Install ARM64 emulator verification dependency
        run: python3 -m pip install --disable-pip-version-check --no-input unicorn==2.1.4
      - name: Execute ARM64 kernel boot verification
        run: python3 tools/verify-arm64-kernel.py
      - name: Run regression tests
        run: npm test
      - name: Generate integration fixture
        run: npm run integration:generate -- --app ci-fixture --output /tmp/mtp-generated --framework all
      - name: Verify generated integration fixture
        run: npm run integration:verify -- --dir /tmp/mtp-generated
      - name: Build frontend
        run: npm run frontend:build
