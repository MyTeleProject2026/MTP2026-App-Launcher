name: MTP2026 App Launcher CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtp2026-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify MTP2026 application sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check backend/server.js
          node --check backend/src/auth/vexaaccount-sso.js
          node --check backend/src/routes/vexaaccount-auth.js
          node --check tools/generate-integration.mjs
          node --check tools/patch-generated-integration.mjs
          node --check tools/verify-generated-integration.mjs
          node --check tools/build-arm64-kernel.mjs

      - name: Verify MTP2026 branding and guest contracts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const branding=JSON.parse(fs.readFileSync('frontend/public/branding/mtp2026-os-branding.json','utf8'));
          if (branding.name!=='MTP2026' || branding.deviceName!=='MTP2026 Device' || branding.osName!=='MTP2026 Device OS' || branding.identity?.provider!=='VexaAccount' || branding.store?.provider!=='VexaStore') {
            throw new Error('Invalid MTP2026 branding contract');
          }
          const manifest=JSON.parse(fs.readFileSync('frontend/public/arm64/guest-manifest.json','utf8'));
          for (const id of ['mtp2026','android','desktop','gaming']) {
            const guest=manifest.guests?.[id];
            if (!guest || guest.architecture!=='arm64' || guest.imageRequired!==true) throw new Error('Invalid guest contract: '+id);
            if (guest.imageKind!=='mtp2026-owned-arm64-linux-profile') throw new Error('Invalid guest image kind: '+id);
          }
          if (manifest.controlKernel?.realOs!==false) throw new Error('Control kernel must remain classified as non-OS control runtime');
          console.log('MTP2026 branding and guest contracts verified');
          NODE
          test -s frontend/public/branding/mtp2026-mark.svg
          test -s frontend/public/branding/mtp2026-logo-horizontal.svg
          test -s frontend/public/branding/mtp2026-branding.json
          test -s os/mtp2026-linux-arm64/build.sh
          test -s os/mtp2026-guest-profiles/build-all.sh

      - name: Run repository tests
        run: npm test

      - name: Generate and verify integration fixture
        run: |
          npm run integration:generate -- --app ci-fixture --output /tmp/mtp-generated --framework all
          npm run integration:verify -- --dir /tmp/mtp-generated

      - name: Build primary frontend
        run: npm run frontend:build

      - name: Install Desktop Edition dependencies
        working-directory: frontend-MTP2026-2Desktop
        run: npm install --no-audit --no-fund

      - name: Build Desktop Edition
        working-directory: frontend-MTP2026-2Desktop
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Verify Desktop Edition build output
        working-directory: frontend-MTP2026-2Desktop
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/arm64/guest-manifest.json
          test -s dist/site-profile.js
          test -s dist/build-info.json
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('dist/build-info.json','utf8')); if(b.product!=='MTP2026 Desktop Edition'||b.architecture!=='arm64'||b.commit!==process.env.EXPECTED_COMMIT) throw new Error('Desktop build metadata contract failed');"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8')); if(m.name!=='MTP2026 Desktop Edition'||m.short_name!=='MTP2026'||m.start_url!=='/'||m.scope!=='/'||m.display!=='standalone') throw new Error('Desktop PWA contract failed');"
          echo "MTP2026 Desktop Edition build contract verified"
