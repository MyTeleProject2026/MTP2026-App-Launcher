name: MTP2026 Five OS Android APK packages

on:
  push:
    branches: [main]
    paths:
      - "packaging/android/**"
      - ".github/workflows/android-packages.yml"
  pull_request:
    branches: [main]
    paths:
      - "packaging/android/**"
      - ".github/workflows/android-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APKs for all five OS editions plus owner
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/.release-keystore/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build five OS APKs and owner APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean \\
            assembleUserRelease assembleDesktopRelease assembleAndroidosRelease assembleGamingosRelease assembleDeviceosRelease assembleOwnerRelease \\
            bundleUserRelease bundleDesktopRelease bundleAndroidosRelease bundleGamingosRelease bundleDeviceosRelease bundleOwnerRelease

      - name: Verify all OS and owner release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          for variant in user desktop androidos gamingos deviceos owner; do
            APK="app/build/outputs/apk/$variant/release/app-$variant-release.apk"
            [ -s "$APK" ] || { echo "Missing APK: $APK" >&2; find app/build/outputs/apk -maxdepth 4 -type f -print >&2; exit 1; }
            unzip -t "$APK" >/dev/null
            BADGING=$("$AAPT2" dump badging "$APK")
            printf '%s\\n' "$BADGING" | grep -q '^package: name='
            printf '%s\\n' "$BADGING" | grep -q '^application-label:'
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "Verified signed APK: $variant"
          done

          for variant in user desktop androidos gamingos deviceos owner; do
            AAB="app/build/outputs/bundle/${variant}Release/app-${variant}-release.aab"
            [ -s "$AAB" ] || { echo "Missing AAB: $AAB" >&2; find app/build/outputs/bundle -maxdepth 4 -type f -print >&2; exit 1; }
            unzip -t "$AAB" >/dev/null
            unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
            jarsigner -verify "$AAB" >/dev/null
          done
          echo "Five OS APK/AAB editions and owner control package verified."

      - uses: actions/upload-artifact@v7
        with:
          name: mtp2026-five-os-android-apks-and-aabs
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/user/release/*.apk
            packaging/android/app/build/outputs/apk/desktop/release/*.apk
            packaging/android/app/build/outputs/apk/androidos/release/*.apk
            packaging/android/app/build/outputs/apk/gamingos/release/*.apk
            packaging/android/app/build/outputs/apk/deviceos/release/*.apk
            packaging/android/app/build/outputs/apk/owner/release/*.apk
            packaging/android/app/build/outputs/bundle/userRelease/*.aab
            packaging/android/app/build/outputs/bundle/desktopRelease/*.aab
            packaging/android/app/build/outputs/bundle/androidosRelease/*.aab
            packaging/android/app/build/outputs/bundle/gamingosRelease/*.aab
            packaging/android/app/build/outputs/bundle/deviceosRelease/*.aab
            packaging/android/app/build/outputs/bundle/ownerRelease/*.aab
