name: MTP2026 Launcher Android packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/.release-keystore/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build user and owner APK/AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleUserRelease bundleUserRelease assembleOwnerRelease bundleOwnerRelease
      - name: Verify user and owner release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          for variant in userRelease ownerRelease; do
            APK="app/build/outputs/apk/$variant/app-${variant}.apk"
            [ -s "$APK" ] || { echo "Missing APK: $APK" >&2; exit 1; }
            unzip -t "$APK" >/dev/null
            "$AAPT2" dump badging "$APK" | grep -E "package: name=|application-label:|application-icon:" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
          for variant in userRelease ownerRelease; do
            AAB="app/build/outputs/bundle/$variant/app-${variant}.aab"
            [ -s "$AAB" ] || { echo "Missing AAB: $AAB" >&2; exit 1; }
            unzip -t "$AAB" >/dev/null
            unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
            jarsigner -verify "$AAB" >/dev/null
          done
          echo "User and Owner Android packages verified."
      - uses: actions/upload-artifact@v7
        with:
          name: mtp2026-user-owner-android-release
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/userRelease/*.apk
            packaging/android/app/build/outputs/apk/ownerRelease/*.apk
            packaging/android/app/build/outputs/bundle/userRelease/*.aab
            packaging/android/app/build/outputs/bundle/ownerRelease/*.aab
