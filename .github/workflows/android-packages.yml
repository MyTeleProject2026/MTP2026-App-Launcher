name: MTP2026 Launcher Android packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/.release-keystore/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build APK and AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease
      - name: Verify release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          for f in "$APK" "$AAB"; do
            [ -f "$f" ] || { echo "Missing release binary: $f" >&2; exit 1; }
            [ -s "$f" ] || { echo "Release binary is empty: $f" >&2; exit 1; }
            stat -c '%n %s bytes' "$f"
          done

          echo "Checking APK archive integrity..."
          unzip -t "$APK" >/dev/null

          echo "Checking APK Android metadata..."
          "$AAPT2" dump badging "$APK" >/dev/null

          echo "Checking APK release signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Checking AAB archive integrity..."
          unzip -t "$AAB" >/dev/null

          echo "Checking required AAB base module..."
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'

          echo "Checking AAB release signature..."
          jarsigner -verify "$AAB" >/dev/null

          echo "Release binary verification passed."
      - uses: actions/upload-artifact@v7
        with:
          name: mtp2026-launcher-android-release
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/release/*.apk
            packaging/android/app/build/outputs/bundle/release/*.aab
