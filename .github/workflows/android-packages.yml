name: MTP2026 Launcher Android packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/mtp2026-launcher-keystore/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MTP2026_APP_LAUNCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MTP2026_APP_LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build APK and AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease
      - name: Verify release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          for pattern in 'app/build/outputs/apk/release/*.apk' 'app/build/outputs/bundle/release/*.aab'; do
            matches=( $pattern ); [ -e "${matches[0]}" ] || { echo "Missing release binary: $pattern" >&2; exit 1; }
          done
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec stat -c '%n %s bytes' {} \;
          while IFS= read -r f; do size=$(stat -c '%s' "$f"); [ "$size" -gt 100000 ] || { echo "Release binary unexpectedly small: $f ($size bytes)" >&2; exit 1; }; done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \))
      - uses: actions/upload-artifact@v7
        with:
          name: mtp2026-launcher-android-release
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/release/*.apk
            packaging/android/app/build/outputs/bundle/release/*.aab
