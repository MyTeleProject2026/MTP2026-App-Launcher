name: MTP2026 Launcher Android packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Build APK and AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease
      - name: Verify release binaries
        working-directory: packaging/android
        run: |
          set -euo pipefail
          for pattern in 'app/build/outputs/apk/release/*.apk' 'app/build/outputs/bundle/release/*.aab'; do
            matches=( $pattern )
            [ -e "${matches[0]}" ] || { echo "Missing release binary: $pattern" >&2; exit 1; }
          done
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec stat -c '%n %s bytes' {} \;
          while IFS= read -r f; do size=$(stat -c '%s' "$f"); [ "$size" -gt 100000 ] || { echo "Release binary unexpectedly small: $f ($size bytes)" >&2; exit 1; }; done < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \))
      - uses: actions/upload-artifact@v7
        with:
          name: mtp2026-launcher-android-release
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/release/*.apk
            packaging/android/app/build/outputs/bundle/release/*.aab
