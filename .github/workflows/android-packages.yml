name: MTP2026 Launcher Android packages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and AAB
        working-directory: packaging/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mtp2026-launcher-android-release
          path: |
            packaging/android/app/build/outputs/apk/release/*.apk
            packaging/android/app/build/outputs/bundle/release/*.aab
