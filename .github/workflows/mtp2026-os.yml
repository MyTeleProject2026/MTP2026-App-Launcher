name: MTP2026 Real OS Build

on:
  push:
    branches: [main]
    paths:
      - "os/mtp2026-linux-arm64/**"
      - "os/mtp2026-guest-profiles/**"
      - "tools/build-arm64-browser-runtime.sh"
      - "tools/build-mtp2026-firmware.sh"
      - "tools/build-mtp2026-boot-disk.sh"
      - ".github/workflows/mtp2026-os.yml"
  pull_request:
    branches: [main]
    paths:
      - "os/mtp2026-linux-arm64/**"
      - "os/mtp2026-guest-profiles/**"
      - "tools/build-arm64-browser-runtime.sh"
      - "tools/build-mtp2026-firmware.sh"
      - "tools/build-mtp2026-boot-disk.sh"
      - ".github/workflows/mtp2026-os.yml"

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable ARM64 Docker emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install ARM64 OS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu build-essential xz-utils cpio rsync file
      - name: Build all four real MTP2026 ARM64 guest profiles
        env:
          MTP2026_BUILD_BROWSER_RUNTIME: "1"
        run: |
          chmod +x os/mtp2026-guest-profiles/build-all.sh
          bash os/mtp2026-guest-profiles/build-all.sh
      - name: Validate all four bootable guest artifacts
        run: |
          set -euo pipefail
          for profile in mtp2026 android desktop gaming; do
            dir="os/mtp2026-linux-arm64/out/artifacts/$profile"
            test -s "$dir/mtp2026-$profile-arm64-linux.Image"
            test -s "$dir/mtp2026-$profile-initramfs.cpio.gz"
            test -s "$dir/mtp2026-$profile-boot-disk.img"
            test -s "$dir/mtp2026-arm64-boot-firmware.bin"
            echo "VALIDATED $profile"
          done
      - name: Upload four real ARM64 guest bundles
        uses: actions/upload-artifact@v4
        with:
          name: mtp2026-four-real-arm64-guests
          path: os/mtp2026-linux-arm64/out/artifacts/
          if-no-files-found: error
