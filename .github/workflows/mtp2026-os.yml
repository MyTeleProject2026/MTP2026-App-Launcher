name: MTP2026 Real OS Build

on:
  push:
    branches: [main]
    paths: ["os/**","tools/build-arm64-kernel.mjs","tools/verify-arm64-kernel.py",".github/workflows/mtp2026-os.yml"]
  pull_request:
    branches: [main]
    paths: ["os/**","tools/build-arm64-kernel.mjs","tools/verify-arm64-kernel.py",".github/workflows/mtp2026-os.yml"]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build MTP2026 BIOS and UEFI images
        working-directory: os
        run: cargo build
      - name: Install Rust LLVM tools for ARM64 image conversion
        run: rustup component add llvm-tools-preview
      - name: Build MTP2026 ARM64 kernel
        working-directory: os
        run: cargo build --manifest-path arm64-kernel/Cargo.toml --target aarch64-unknown-none
      - name: Build flat ARM64 guest image
        run: node tools/build-arm64-kernel.mjs
      - name: Execute ARM64 kernel boot verification
        run: |
          python3 -m pip install --disable-pip-version-check --no-input unicorn==2.1.4
          python3 tools/verify-arm64-kernel.py
      - name: Validate ARM64 kernel artifact
        run: |
          set -euo pipefail
          test -s frontend/public/arm64/mtp2026-arm64-kernel.bin
          file frontend/public/arm64/mtp2026-arm64-kernel.bin
      - name: Upload ARM64 kernel and firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtp2026-os-images
          path: |
            os/target/debug/build/**/mtp2026-bios.img
            os/target/debug/build/**/mtp2026-uefi.img
            os/target/aarch64-unknown-none/debug/mtp2026-arm64-kernel
            frontend/public/arm64/mtp2026-arm64-kernel.bin
          if-no-files-found: error
