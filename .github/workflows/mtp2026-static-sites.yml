name: MTP2026 All Frontend Static Sites

concurrency:
  group: mtp2026-static-sites-${{ github.ref }}
  cancel-in-progress: true

"on":
  push:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - "frontend-MTP2026-AppLauncher/**"
      - "frontend-MTP2026-Android/**"
      - "Frontend-MTP202026-ROG_gamingOS/**"
      - "frontend-MTP2026OS/**"
      - ".github/workflows/mtp2026-static-sites.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - "frontend-MTP2026-AppLauncher/**"
      - "frontend-MTP2026-Android/**"
      - "Frontend-MTP202026-ROG_gamingOS/**"
      - "frontend-MTP2026OS/**"
      - ".github/workflows/mtp2026-static-sites.yml"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop OS
            dir: frontend-MTP2026-2Desktop
            mode: desktop
          - name: Host Launcher
            dir: frontend-MTP2026-AppLauncher
            mode: host
          - name: Android
            dir: frontend-MTP2026-Android
            mode: android
          - name: ROG Gaming
            dir: Frontend-MTP202026-ROG_gamingOS
            mode: gaming
          - name: Device OS
            dir: frontend-MTP2026OS
            mode: mtp2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package.json
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund
      - name: Verify fixed OS profile
        if: matrix.mode != 'host'
        working-directory: ${{ matrix.dir }}
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('os-profile.json','utf8')); if(p.deviceMode!=='${{ matrix.mode }}'||p.architecture!=='arm64'||p.render!=='static-site') process.exit(1); console.log(p)"
      - name: Verify dedicated OS replacement entry point
        if: matrix.mode != 'host' && matrix.mode != 'desktop'
        working-directory: ${{ matrix.dir }}
        env:
          OS_MODE: ${{ matrix.mode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = {
            android: "mtp2026AndroidOS.js",
            gaming: "mtp2026GamingOS.js",
            mtp2026: "mtp2026DeviceOS.js"
          }[process.env.OS_MODE];
          const entry = fs.readFileSync('src/main.jsx', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!expected || !entry.includes(expected)) {
            throw new Error('Dedicated OS entry point is missing for ' + process.env.OS_MODE);
          }
          if (/startupOrchestrator|webOsRuntime|webOsAppSurface/.test(html)) {
            throw new Error('Retired generic OS UI is still wired into ' + process.env.OS_MODE + ' index.html');
          }
          console.log('Dedicated shell entry verified:', expected);
          NODE
      - name: Build static site
        working-directory: ${{ matrix.dir }}
        run: npm run build
      - name: Verify build output
        working-directory: ${{ matrix.dir }}
        run: |
          test -s dist/index.html
          if [ "${{ matrix.mode }}" = "host" ]; then
            test -s dist/manifest.webmanifest
          else
            test -s dist/manifest.webmanifest
            test -s dist/arm64/guest-manifest.json
          fi
