name: MTP2026 Desktop OS Android package

on:
  push:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - "packaging/android/**"
      - "os/mtp2026-guest-profiles/**"
      - "os/mtp2026-linux-arm64/**"
      - "os/mtp2026-firmware/**"
      - "tools/build-arm64-browser-runtime.sh"
      - "tools/build-mtp2026-firmware.sh"
      - "tools/build-mtp2026-boot-disk.sh"
      - ".github/workflows/mtp2026-desktop-android-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend-MTP2026-2Desktop/**"
      - "packaging/android/**"
      - ".github/workflows/mtp2026-desktop-android-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-android:
    name: Build MTP2026 Desktop Edition Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install native ARM64 guest build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libgnutls28-dev cpio curl gzip rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm mtools e2fsprogs

      - name: Enable ARM64 container emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build complete MTP2026 Desktop OS guest
        env:
          MTP2026_BUILD_PROFILES: desktop
          MTP2026_BUILD_BROWSER_RUNTIME: "1"
        run: |
          set -euo pipefail
          bash os/mtp2026-guest-profiles/build-all.sh
          ART="os/mtp2026-linux-arm64/out/artifacts/desktop"
          test -s "$ART/mtp2026-desktop-arm64-linux.Image"
          test -s "$ART/mtp2026-desktop-initramfs.cpio.gz"
          test -s "$ART/mtp2026-desktop-boot-disk.img"
          test -s "$ART/mtp2026-arm64-boot-firmware.bin"
          mkdir -p packaging/android/app/src/main/assets/desktop-guest
          cp "$ART/mtp2026-desktop-arm64-linux.Image" packaging/android/app/src/main/assets/desktop-guest/kernel.Image
          cp "$ART/mtp2026-desktop-initramfs.cpio.gz" packaging/android/app/src/main/assets/desktop-guest/initramfs.cpio.gz
          cp "$ART/mtp2026-desktop-boot-disk.img" packaging/android/app/src/main/assets/desktop-guest/boot-disk.img
          cp "$ART/mtp2026-arm64-boot-firmware.bin" packaging/android/app/src/main/assets/desktop-guest/boot-firmware.bin
          cp "$ART/boot-manifest.json" packaging/android/app/src/main/assets/desktop-guest/boot-manifest.json
          cp "$ART/firmware-manifest.json" packaging/android/app/src/main/assets/desktop-guest/firmware-manifest.json
          cp os/mtp2026-linux-arm64/out/artifacts/mtp2026-arm64-guest-manifest.json packaging/android/app/src/main/assets/desktop-guest/guest-manifest.json
          cat > packaging/android/app/src/main/assets/desktop-guest/profile.json <<'EOF'
          {
            "schema":"mtp2026-android-bundled-guest-v1",
            "profile":"desktop",
            "name":"MTP2026 Desktop OS",
            "edition":"Desktop Edition",
            "architecture":"arm64",
            "machine":"qemu-aarch64-virt",
            "runtimeBackend":"qemu-system-aarch64",
            "kernel":"kernel.Image",
            "initramfs":"initramfs.cpio.gz",
            "bootDisk":"boot-disk.img",
            "firmware":"boot-firmware.bin",
            "guestCore":"MTP2026 ARM64 Linux + BusyBox + native MTP2026 UI/services",
            "identityProvider":"VexaAccount",
            "applicationStore":"VexaStore",
            "importedFrom":"MTP2026 native ARM64 guest build"
          }
          EOF
          (cd packaging/android/app/src/main/assets/desktop-guest && sha256sum * > SHA256SUMS)

      - name: Install ARM64 guest build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex cpio gzip xz-utils curl

      - name: Build MTP2026 Desktop guest core
        working-directory: os/mtp2026-linux-arm64
        run: |
          set -euo pipefail
          rm -rf out
          MTP2026_PROFILE=desktop MTP2026_BROWSER_RUNTIME_DIR="" ./build.sh
          test -s out/artifacts/desktop/mtp2026-desktop-arm64-linux.Image
          test -s out/artifacts/desktop/mtp2026-desktop-initramfs.cpio.gz
          mkdir -p ../../packaging/android/app/src/desktop/assets
          cp out/artifacts/desktop/mtp2026-desktop-arm64-linux.Image ../../packaging/android/app/src/desktop/assets/kernel.Image
          cp out/artifacts/desktop/mtp2026-desktop-initramfs.cpio.gz ../../packaging/android/app/src/desktop/assets/initramfs.cpio.gz
          cp out/rootfs/etc/mtp2026/profile.json ../../packaging/android/app/src/desktop/assets/profile.json
          cp out/rootfs/etc/mtp2026/capabilities.json ../../packaging/android/app/src/desktop/assets/capabilities.json
          cp out/rootfs/etc/mtp2026/firmware-profile.json ../../packaging/android/app/src/desktop/assets/firmware-profile.json
          sha256sum ../../packaging/android/app/src/desktop/assets/kernel.Image ../../packaging/android/app/src/desktop/assets/initramfs.cpio.gz > ../../packaging/android/app/src/desktop/assets/SHA256SUMS
          cat > ../../packaging/android/app/src/desktop/assets/guest-manifest.json <<'EOF'
          {
            "schema": "mtp2026-android-desktop-guest-bundle-v1",
            "guestId": "desktop",
            "name": "MTP2026 Desktop OS",
            "edition": "MTP2026 Desktop Edition",
            "architecture": "arm64",
            "machine": "qemu-aarch64-virt",
            "bootProtocol": "linux-arm64-guest",
            "runtimeBackend": "qemu-system-aarch64-or-native-provider",
            "profileSource": "MTP2026-owned ARM64 Desktop guest profile",
            "kernelAsset": "kernel.Image",
            "initramfsAsset": "initramfs.cpio.gz",
            "profileAsset": "profile.json",
            "capabilitiesAsset": "capabilities.json",
            "firmwareContractAsset": "firmware-profile.json"
          }
          EOF

      - name: Build the exact MTP2026 Desktop guest profile
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libgnutls28-dev cpio curl gzip rsync tar e2fsprogs gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
          chmod +x os/mtp2026-guest-profiles/build-all.sh
          MTP2026_BUILD_PROFILES=desktop MTP2026_BUILD_BROWSER_RUNTIME=1 bash os/mtp2026-guest-profiles/build-all.sh
          artifact="os/mtp2026-linux-arm64/out/artifacts/desktop"
          test -s "$artifact/mtp2026-desktop-arm64-linux.Image"
          test -s "$artifact/mtp2026-desktop-initramfs.cpio.gz"
          test -s "$artifact/mtp2026-desktop-boot-disk.img"
          test -s "$artifact/mtp2026-arm64-boot-firmware.bin"
          mkdir -p packaging/android/app/src/main/assets/mtp2026-desktop-guest
          tar -C "$artifact" -czf packaging/android/app/src/main/assets/mtp2026-desktop-guest/mtp2026-desktop-arm64-guest.tar.gz             mtp2026-desktop-arm64-linux.Image             mtp2026-desktop-initramfs.cpio.gz             mtp2026-desktop-boot-disk.img             mtp2026-arm64-boot-firmware.bin             firmware-manifest.json             boot-manifest.json
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("os/mtp2026-linux-arm64/out/artifacts/desktop")
          manifest=json.loads(pathlib.Path("os/mtp2026-linux-arm64/out/artifacts/mtp2026-arm64-guest-manifest.json").read_text())
          guest=manifest["guests"]["desktop"]
          bundle=pathlib.Path("packaging/android/app/src/main/assets/mtp2026-desktop-guest/mtp2026-desktop-arm64-guest.tar.gz")
          guest=dict(guest)
          guest["androidImport"]={"asset":bundle.name,"sha256":hashlib.sha256(bundle.read_bytes()).hexdigest(),"bundled":True}
          pathlib.Path("packaging/android/app/src/main/assets/mtp2026-desktop-guest/guest-profile.json").write_text(json.dumps(guest,indent=2)+"\n")
          PY

      - name: Build Desktop Android packages
        working-directory: packaging/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDesktopDebug bundleDesktopDebug

      - name: Verify Desktop APK
        working-directory: packaging/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/desktop/debug/app-desktop-debug.apk"
          AAB="app/build/outputs/bundle/desktopDebug/app-desktop-debug.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -E "desktop-guest/(kernel.Image|initramfs.cpio.gz|profile.json|capabilities.json|firmware-profile.json|guest-manifest.json|SHA256SUMS)"
          unzip -p "$APK" assets/desktop-guest/guest-manifest.json | grep -q '"guestId": "desktop"'
          unzip -p "$APK" assets/desktop-guest/profile.json | grep -q '"id": "desktop"'
          unzip -p "$APK" assets/desktop-guest/capabilities.json | grep -q '"profile": "desktop"'
          unzip -l "$APK" | grep -q "assets/desktop-guest/kernel.Image"
          unzip -l "$APK" | grep -q "assets/desktop-guest/initramfs.cpio.gz"
          unzip -l "$APK" | grep -q "assets/desktop-guest/boot-disk.img"
          unzip -l "$APK" | grep -q "assets/desktop-guest/boot-firmware.bin"
          echo "Bundled complete MTP2026 Desktop OS guest core detected in APK."
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package: name='com.mtp2026.desktop'|application-label:'MTP2026 Desktop Edition'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml >/dev/null
          echo "MTP2026 Desktop Edition Android package verified."

      - name: Upload Desktop Android packages
        uses: actions/upload-artifact@v7
        with:
          name: mtp2026-desktop-edition-android
          if-no-files-found: error
          path: |
            packaging/android/app/build/outputs/apk/desktop/debug/app-desktop-debug.apk
            packaging/android/app/build/outputs/bundle/desktopDebug/app-desktop-debug.aab
