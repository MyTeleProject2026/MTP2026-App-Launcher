name: MTP2026 production verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '27 * * * *'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: ${{ vars.MTP_FRONTEND_URL || 'https://mtp2026-app-launcher.onrender.com' }}
      BACKEND_URL: ${{ vars.MTP_BACKEND_URL || 'https://mtp2026-app-launcher-backend.onrender.com' }}
      EXPECTED_COMMIT: ''
      DEPLOYED_FRONTEND_URL: ''
    steps:
      - name: Checkout source for frontend revision detection
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this push changes the Host Launcher frontend
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if printf '%s\n' "$changed" | grep -Eq '^frontend-MTP2026-AppLauncher/' ; then
            target="$FRONTEND_URL"
            label="Host Launcher"
          elif printf '%s\n' "$changed" | grep -Eq '^frontend-MTP2026-2Desktop/' ; then
            target="https://mtp2026-desktopos-peun.onrender.com"
            label="Desktop OS"
          elif printf '%s\n' "$changed" | grep -Eq '^frontend-MTP2026-Android/' ; then
            target="https://mtp2026-android-os.onrender.com"
            label="Android OS"
          elif printf '%s\n' "$changed" | grep -Eq '^Frontend-MTP202026-ROG_gamingOS/' ; then
            target="https://mtp2026-rog-gaming-os.onrender.com"
            label="Gaming OS"
          elif printf '%s\n' "$changed" | grep -Eq '^frontend-MTP2026OS/' ; then
            target="https://mtp2026-device-os.onrender.com"
            label="Device OS"
          else
            target=""
            label=""
          fi
          if [ -n "$target" ]; then
            echo "EXPECTED_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"
            echo "DEPLOYED_FRONTEND_URL=$target" >> "$GITHUB_ENV"
            echo "DEPLOYED_FRONTEND_LABEL=$label" >> "$GITHUB_ENV"
            echo "This push changes $label source; checking its own deployment revision at $target."
          else
            echo "This push does not change a deployed frontend source; skipping frontend commit propagation check."
          fi

      - name: Verify production frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          frontend="${FRONTEND_URL%/}"
          backend="${BACKEND_URL%/}"

          echo "Checking frontend: $frontend"
          curl --fail --silent --show-error --location --max-time 20 "$frontend/" >/tmp/frontend.html
          grep -q 'MTP2026' /tmp/frontend.html

          echo "Waiting for backend health: $backend"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 "$backend/api/health" >/tmp/health.json; then
              if node -e "const h=require('fs').readFileSync('/tmp/health.json','utf8'); const j=JSON.parse(h); if(!j.ok || j.databaseType!=='TiDB MySQL') process.exit(1); console.log(j)"; then
                break
              fi
            fi
            test "$attempt" -lt 30 || { echo "Backend did not become healthy"; exit 1; }
            sleep 10
          done

          echo "Checking backend SSO configuration contract"
          curl --fail --silent --show-error --location --max-time 20 "$backend/api/config" >/tmp/config.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/config.json','utf8')); if(!j.sso?.configured || j.sso?.sessionMode!=='backend-managed') process.exit(1); console.log({sso:j.sso,databaseType:j.databaseType})"

          echo "Checking VexaAccount login redirect"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$backend/api/auth/login")
          test "$code" = "302"

          deploy_frontend="${DEPLOYED_FRONTEND_URL:-$frontend}"
          echo "Checking deployed frontend build information: $deploy_frontend"
          if ! curl --fail --silent --show-error --location --max-time 20 "$deploy_frontend/build-info.json?verify=${EXPECTED_COMMIT:-scheduled}" >/tmp/build-info.json; then
            echo "WARNING: $deploy_frontend does not expose build-info.json; skipping commit comparison."
            exit 0
          fi

          actual=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/build-info.json','utf8')); process.stdout.write(String(j.commit || 'unknown'))")
          echo "Production frontend reports commit: $actual"

          if [ -n "${EXPECTED_COMMIT:-}" ] && [ "$actual" != "unknown" ] && [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "Render frontend has not propagated $EXPECTED_COMMIT yet; polling for deployment completion."
            for attempt in $(seq 1 60); do
              sleep 15
              if curl --fail --silent --show-error --location --max-time 20 "$deploy_frontend/build-info.json?verify=${EXPECTED_COMMIT}&attempt=$attempt" >/tmp/build-info.json; then
                actual=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/build-info.json','utf8')); process.stdout.write(String(j.commit || 'unknown'))")
                echo "Deployment poll $attempt/60: $actual"
                if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                  echo "Production frontend now serves the pushed commit."
                  exit 0
                fi
              fi
            done
            echo "::error::Render frontend did not propagate $EXPECTED_COMMIT within 15 minutes; live frontend remains on $actual."
            exit 1
          fi

          echo "Production frontend/backend verification passed."
