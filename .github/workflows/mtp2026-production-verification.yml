name: MTP2026 production verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '27 * * * *'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: ${{ vars.MTP_FRONTEND_URL || 'https://mtp2026-app-launcher.onrender.com' }}
      BACKEND_URL: ${{ vars.MTP_BACKEND_URL || 'https://mtp2026-app-launcher-backend.onrender.com' }}
      EXPECTED_COMMIT: ''
      DEPLOYED_FRONTEND_URLS: ''
    steps:
      - name: Checkout source for frontend revision detection
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect every changed OS frontend deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          targets=()
          while IFS='|' read -r folder label url; do
            if printf '%s\n' "$changed" | grep -Eq "^$folder/"; then
              targets+=("$label=$url")
            fi
          done <<'MTP_TARGETS'
          frontend-MTP2026-AppLauncher|Host Launcher|${{ vars.MTP_FRONTEND_URL || 'https://mtp2026-app-launcher.onrender.com' }}
          frontend-MTP2026-2Desktop|Desktop OS|https://mtp2026-desktopos-peun.onrender.com
          frontend-MTP2026-Android|Android OS|https://mtp2026-android-os.onrender.com
          Frontend-MTP202026-ROG_gamingOS|Gaming OS|https://mtp2026-rog-gaming-os.onrender.com
          frontend-MTP2026OS|Device OS|https://mtp2026-device-os.onrender.com
          MTP_TARGETS
          if [ "${#targets[@]}" -gt 0 ]; then
            printf 'EXPECTED_COMMIT=%s\n' "${{ github.sha }}" >> "$GITHUB_ENV"
            printf 'DEPLOYED_FRONTEND_URLS=%s\n' "$(IFS=';'; echo "${targets[*]}")" >> "$GITHUB_ENV"
            printf 'Changed frontend deployments: %s\n' "${targets[*]}"
          else
            echo "This push does not change a deployed frontend source; skipping frontend commit propagation check."
          fi
      - name: Verify production frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          frontend="${FRONTEND_URL%/}"
          backend="${BACKEND_URL%/}"

          echo "Checking frontend: $frontend"
          curl --fail --silent --show-error --location --max-time 20 "$frontend/" >/tmp/frontend.html
          grep -q 'MTP2026' /tmp/frontend.html

          echo "Waiting for backend health: $backend"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 "$backend/api/health" >/tmp/health.json; then
              if node -e "const h=require('fs').readFileSync('/tmp/health.json','utf8'); const j=JSON.parse(h); if(!j.ok || j.databaseType!=='TiDB MySQL') process.exit(1); console.log(j)"; then
                break
              fi
            fi
            test "$attempt" -lt 30 || { echo "Backend did not become healthy"; exit 1; }
            sleep 10
          done

          echo "Checking backend SSO configuration contract"
          curl --fail --silent --show-error --location --max-time 20 "$backend/api/config" >/tmp/config.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/config.json','utf8')); if(!j.sso?.configured || j.sso?.sessionMode!=='backend-managed') process.exit(1); console.log({sso:j.sso,databaseType:j.databaseType})"

          echo "Checking VexaAccount login redirect"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$backend/api/auth/login")
          test "$code" = "302"

          targets="${DEPLOYED_FRONTEND_URLS:-Host Launcher=$frontend}"
          IFS=';' read -r -a target_list <<< "$targets"
          for item in "${target_list[@]}"; do
            label="${item%%=*}"
            deploy_frontend="${item#*=}"
            deploy_frontend="${deploy_frontend%/}"
            echo "Checking deployed frontend build information: $label ($deploy_frontend)"
            if ! curl --fail --silent --show-error --location --max-time 20 "$deploy_frontend/build-info.json?verify=${EXPECTED_COMMIT:-scheduled}" >/tmp/build-info.json; then
              if [ -n "${EXPECTED_COMMIT:-}" ]; then
                echo "::error::Changed frontend $label does not expose build-info.json; cannot verify commit propagation."
                exit 1
              fi
              echo "WARNING: $deploy_frontend does not expose build-info.json; skipping scheduled commit comparison."
              continue
            fi

            actual=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/build-info.json','utf8')); process.stdout.write(String(j.commit || 'unknown'))")
            echo "$label production frontend reports commit: $actual"

            if [ -n "${EXPECTED_COMMIT:-}" ] && [ "$actual" != "unknown" ] && [ "$actual" != "$EXPECTED_COMMIT" ]; then
              echo "$label has not propagated $EXPECTED_COMMIT yet; polling for deployment completion."
              deployed=false
              for attempt in $(seq 1 60); do
                sleep 15
                if curl --fail --silent --show-error --location --max-time 20 "$deploy_frontend/build-info.json?verify=${EXPECTED_COMMIT}&attempt=$attempt" >/tmp/build-info.json; then
                  actual=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/build-info.json','utf8')); process.stdout.write(String(j.commit || 'unknown'))")
                  echo "$label deployment poll $attempt/60: $actual"
                  if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                    deployed=true
                    break
                  fi
                fi
              done
              if [ "$deployed" != true ]; then
                echo "::error::$label did not propagate $EXPECTED_COMMIT within 15 minutes; live frontend remains on $actual."
                exit 1
              fi
            fi
          done
          echo "Production frontend/backend verification passed."
