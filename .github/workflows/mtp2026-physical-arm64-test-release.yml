name: MTP2026 Physical ARM64 Test Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'os/mtp2026-linux-arm64/**'
      - 'os/mtp2026-guest-profiles/**'
      - 'frontend/public/arm64/guest-manifest.json'
      - 'tools/**'
      - '.github/workflows/mtp2026-physical-arm64-test-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build scripts before expensive ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/build-arm64-browser-runtime.sh
          bash -n os/mtp2026-guest-profiles/build-all.sh
          bash -n os/mtp2026-linux-arm64/build.sh
          bash -n os/mtp2026-linux-arm64/rootfs/mtp2026-browser
          bash -n os/mtp2026-linux-arm64/rootfs/init.template
          grep -q 'MTP2026 Browser' os/mtp2026-linux-arm64/rootfs/browser.json
          grep -q 'CONFIG_DRM_VIRTIO_GPU=y' os/mtp2026-linux-arm64/build.sh
          grep -q 'CONFIG_DRM_FBDEV_EMULATION=y' os/mtp2026-linux-arm64/build.sh
          grep -q 'qemu-system-aarch64' frontend/src/guestRuntimeManifest.js frontend/src/arm64GuestRuntime.js

      - name: Install ARM64 build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio curl gzip rsync tar python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm qemu-system-aarch64 file

      - name: Build ARM64 Chromium-compatible browser runtime
        env:
          MTP2026_BUILD_BROWSER_RUNTIME: "1"
        run: bash tools/build-arm64-browser-runtime.sh os/mtp2026-linux-arm64/out/browser-runtime

      - name: Build all four MTP2026 physical-test guest profiles
        env:
          MTP2026_BUILD_PROFILES: mtp2026 android windows11 gaming
          MTP2026_BUILD_BROWSER_RUNTIME: "1"
        run: bash os/mtp2026-guest-profiles/build-all.sh

      - name: Validate embedded ARM64 browser runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x os/mtp2026-linux-arm64/out/browser-runtime/usr/bin/chromium
          test -x os/mtp2026-linux-arm64/out/browser-runtime/usr/lib/chromium/chromium
          test -f os/mtp2026-linux-arm64/out/browser-runtime/lib/ld-linux-aarch64.so.1
          test -f os/mtp2026-linux-arm64/out/browser-runtime/MANIFEST
          grep -q 'MTP2026 ARM64 Chromium-compatible runtime' os/mtp2026-linux-arm64/out/browser-runtime/MANIFEST
          for profile in mtp2026 android windows11 gaming; do
            initrd="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-initramfs.cpio.gz"
            gzip -dc "$initrd" | cpio -it 2>/dev/null | grep -qx './usr/bin/chromium'
            gzip -dc "$initrd" | cpio -it 2>/dev/null | grep -qx './usr/bin/mtp2026-browser'
            gzip -dc "$initrd" | cpio -it 2>/dev/null | grep -qx './usr/bin/mtp2026-ui'
            gzip -dc "$initrd" | cpio -it 2>/dev/null | grep -qx './etc/mtp2026/browser.json'
            gzip -dc "$initrd" | cpio -it 2>/dev/null | grep -qx './etc/mtp2026/browser-runtime'
          done

      - name: Validate all four guest artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          for profile in mtp2026 android windows11 gaming; do
            image="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-arm64-linux.Image"
            initrd="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-initramfs.cpio.gz"
            test -s "$image"
            test -s "$initrd"
            file "$image" | grep -Eiq 'ARM aarch64|ARM64|Linux kernel'
          done

      - name: Validate guest browser graphical integration
        shell: bash
        run: |
          set -euo pipefail
          for profile in mtp2026 android windows11 gaming; do
            initrd="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-initramfs.cpio.gz"
            listing="$(gzip -dc "$initrd" | cpio -it 2>/dev/null)"
            printf '%s\n' "$listing" | grep -qx './etc/mtp2026/browser.json'
            printf '%s\n' "$listing" | grep -qx './usr/bin/mtp2026-ui'
            printf '%s\n' "$listing" | grep -qx './usr/bin/mtp2026-browser'
            printf '%s\n' "$listing" | grep -qx './usr/bin/chromium'
            printf '%s\n' "$listing" | grep -qx './usr/lib/chromium/chromium'
          done
      - name: Boot-test all guest profiles under AArch64 QEMU
        shell: bash
        run: |
          set -euo pipefail
          for profile in mtp2026 android windows11 gaming; do
            image="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-arm64-linux.Image"
            initrd="os/mtp2026-linux-arm64/out/artifacts/${profile}/mtp2026-${profile}-initramfs.cpio.gz"
            log="/tmp/mtp2026-${profile}.log"
            set +e
            printf 'browser-test\n' | timeout 45s qemu-system-aarch64 \
              -M virt -cpu cortex-a72 -m 1024 -display none \
              -device virtio-gpu-pci -device virtio-keyboard-pci -device virtio-mouse-pci -device virtio-tablet-pci \
              -device virtio-net-pci,netdev=net0 -netdev user,id=net0 \
              -audiodev driver=none,id=mtp2026audio -device virtio-sound-pci,audiodev=mtp2026audio \
              -kernel "$image" -initrd "$initrd" \
              -append 'console=ttyAMA0 rdinit=/init' > "$log" 2>&1
            code=$?
            set -e
            cat "$log"
            grep -q 'MTP2026 GUEST SYSTEM' "$log"
            grep -q 'MTP2026 GUI COMPOSITOR STARTED' "$log"
            grep -q "MTP2026\[${profile}\]>" "$log"
            grep -q 'MTP2026 BROWSER SMOKE TEST PASSED' "$log"
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              echo "QEMU boot test failed for ${profile} with exit code ${code}" >&2
              exit "$code"
            fi
          done

      - name: Assemble physical test bundles and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          for profile in mtp2026 android windows11 gaming; do
            dir="os/mtp2026-linux-arm64/out/artifacts/${profile}"
            tar -C "$dir" -czf "release/mtp2026-${profile}-arm64-guest.tar.gz" \
              "mtp2026-${profile}-arm64-linux.Image" \
              "mtp2026-${profile}-initramfs.cpio.gz"
          done
          sha256sum release/mtp2026-*-arm64-guest.tar.gz > release/SHA256SUMS.txt

          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('release')
          profiles = {}
          for profile in ('mtp2026', 'android', 'windows11', 'gaming'):
              image = pathlib.Path(f'os/mtp2026-linux-arm64/out/artifacts/{profile}/mtp2026-{profile}-arm64-linux.Image')
              initrd = pathlib.Path(f'os/mtp2026-linux-arm64/out/artifacts/{profile}/mtp2026-{profile}-initramfs.cpio.gz')
              bundle = root / f'mtp2026-{profile}-arm64-guest.tar.gz'
              def sha(p):
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for chunk in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(chunk)
                  return h.hexdigest()
              profiles[profile] = {
                  'id': profile,
                  'architecture': 'arm64',
                  'machine': 'qemu-aarch64-virt',
                  'imageSource': {
                      'url': f'https://github.com/MyTeleProject2026/MTP2026-App-Launcher/releases/download/mtp2026-physical-test/mtp2026-{profile}-arm64-guest.tar.gz',
                      'sha256': sha(bundle),
                      'kind': 'arm64-qemu-guest-bundle'
                  },
                  'initrdName': f'mtp2026-{profile}-initramfs.cpio.gz',
                  'kernelName': f'mtp2026-{profile}-arm64-linux.Image',
                  'kernelSha256': sha(image),
                  'initrdSha256': sha(initrd),
                  'runtime': 'qemu-system-aarch64',
                  'bootArgs': ['-M','virt','-cpu','cortex-a72','-m','1024','-append','console=ttyAMA0 rdinit=/init']
              }
          manifest = {
              'schema': 'mtp2026-physical-arm64-test-v1',
              'version': 'physical-test',
              'architecture': 'arm64',
              'machine': 'qemu-aarch64-virt',
              'runtime': {'engine':'qemu-system-aarch64','minimum':'8.x','requiresHostBinary':True},
              'guests': profiles
          }
          (root / 'physical-test-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Publish/update stable physical-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view mtp2026-physical-test >/dev/null 2>&1; then
            gh release delete mtp2026-physical-test --yes --cleanup-tag
          fi
          gh release create mtp2026-physical-test \
            release/mtp2026-mtp2026-arm64-guest.tar.gz \
            release/mtp2026-android-arm64-guest.tar.gz \
            release/mtp2026-windows11-arm64-guest.tar.gz \
            release/mtp2026-gaming-arm64-guest.tar.gz \
            release/SHA256SUMS.txt \
            release/physical-test-manifest.json \
            --target "$GITHUB_SHA" --prerelease \
            --title 'MTP2026 Physical ARM64 Test Build' \
            --notes 'Generated ARM64 guest images for physical MTP2026 launcher testing. All four bundles are MTP2026-owned ARM64 Linux guest profiles and are not Apple, Microsoft, Google, or Android firmware.'

      - name: Verify published physical-test release and launcher sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view mtp2026-physical-test --json isPrerelease --jq '.isPrerelease')" = "true"
          gh release download mtp2026-physical-test --pattern 'physical-test-manifest.json' --dir /tmp/mtp2026-release-verify --clobber
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path('/tmp/mtp2026-release-verify')
          manifest = json.loads((root / 'physical-test-manifest.json').read_text())
          assert manifest['schema'] == 'mtp2026-physical-arm64-test-v1'
          assert manifest['architecture'] == 'arm64'
          assert set(manifest['guests']) == {'mtp2026', 'android', 'windows11', 'gaming'}
          for profile, guest in manifest['guests'].items():
              url = guest['imageSource']['url']
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              assert digest == guest['imageSource']['sha256'], f'{profile}: published bundle SHA-256 mismatch'
              assert len(data) > 1024, f'{profile}: published bundle is unexpectedly small'
          print('Published physical-test release verified for all four guest bundles.')
          PY

      # Keep the physical-test workflow in the push path so runtime/source fixes rerun the complete release gate.
      # Full physical-release gate: build, boot-test, checksum, publish, then download/verify all four bundles.
