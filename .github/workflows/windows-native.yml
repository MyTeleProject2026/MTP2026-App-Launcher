name: MTP2026 Windows native shell
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Tauri Windows icon exists
        shell: pwsh
        run: |
          $iconDir = Join-Path $env:GITHUB_WORKSPACE 'native/windows-tauri/icons'
          $iconPath = Join-Path $iconDir 'icon.ico'
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          # Always replace the fallback so an old malformed ICO cannot survive.
          $base64 = ''
          [System.IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($base64))
          $final = [System.IO.File]::ReadAllBytes($iconPath)
          if ($final.Length -ne 4286 -or $final[0] -ne 0 -or $final[1] -ne 0 -or $final[2] -ne 1 -or $final[3] -ne 0) {
            throw "Generated Windows ICO is invalid: $iconPath ($($final.Length) bytes)"
          }
          Write-Host "Validated deterministic Windows ICO: $iconPath ($($final.Length) bytes)"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build web application
        run: npm run frontend:build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Build Windows native application
        working-directory: native/windows-tauri
        run: cargo tauri build
