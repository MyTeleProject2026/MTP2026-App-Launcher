name: MTP2026 Windows native shell
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build web application
        run: npm run frontend:build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Generate Tauri Windows icons
        working-directory: native/windows-tauri
        shell: pwsh
        run: |
          cargo tauri icon ../../frontend/public/icon.svg --output icons
          $iconPath = Join-Path $env:GITHUB_WORKSPACE 'native/windows-tauri/icons/icon.ico'
          if (-not (Test-Path -LiteralPath $iconPath -PathType Leaf)) {
            throw "Tauri icon generation did not create the required Windows ICO: $iconPath"
          }
          $bytes = [System.IO.File]::ReadAllBytes($iconPath)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw "Tauri generated an invalid Windows ICO: $iconPath ($($bytes.Length) bytes)"
          }
          Write-Host "Validated Tauri-generated Windows ICO: $iconPath ($($bytes.Length) bytes)"
      - name: Build Windows native application
        working-directory: native/windows-tauri
        run: cargo tauri build
