name: MTP2026 Windows native shell
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Tauri Windows icon fallback source
        shell: pwsh
        run: |
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'native/windows-tauri/build.rs'
          if (-not (Test-Path -LiteralPath $buildScript -PathType Leaf)) {
            throw "Tauri build script is missing: $buildScript"
          }
          $content = Get-Content -LiteralPath $buildScript -Raw
          if ($content -notmatch 'ensure_windows_icon') {
            throw "Tauri build script does not provide the required Windows icon fallback"
          }
          Write-Host "Verified Tauri build will provision a Windows icon when icon.ico is absent."
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build web application
        run: npm run frontend:build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Build Windows native application
        working-directory: native/windows-tauri
        run: cargo tauri build
