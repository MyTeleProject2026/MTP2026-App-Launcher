name: MTP2026 Windows native shell
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify required Tauri Windows resources
        shell: pwsh
        run: |
          $icon = Join-Path $env:GITHUB_WORKSPACE 'native/windows-tauri/icons/icon.ico'
          if (-not (Test-Path -LiteralPath $icon -PathType Leaf)) {
            throw "Required Tauri Windows icon is missing: $icon"
          }
          $size = (Get-Item -LiteralPath $icon).Length
          if ($size -lt 64) {
            throw "Required Tauri Windows icon is invalid or empty: $icon ($size bytes)"
          }
          Write-Host "Verified Tauri Windows icon: $icon ($size bytes)"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build web application
        run: npm run frontend:build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Build Windows native application
        working-directory: native/windows-tauri
        run: cargo tauri build
