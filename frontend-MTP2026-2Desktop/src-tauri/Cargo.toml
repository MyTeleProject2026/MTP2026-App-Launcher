[package]
name = "mtp2026-desktop"
version = "0.1.0"
description = "MTP2026 Desktop native host"
authors = ["MTP2026"]
edition = "2021"

[lib]
name = "mtp2026_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
